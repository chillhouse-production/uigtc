<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - UIGTC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&family=Fira+Code&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #0B2E34; --secondary: #135D66; --accent: #E39A3B;
      --sand: #F3CC91; --light: #E3FEF7; --dark: #1F2D2F;
      --success: #22c55e; --error: #ef4444; --warning: #f59e0b;
      --info: #3b82f6; --purple: #8b5cf6;
    }
    
    body {
      font-family: 'Source Sans Pro', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh; color: var(--light);
    }
    
    .container { max-width: 1600px; margin: 0 auto; padding: 30px 20px; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 40px; flex-wrap: wrap; gap: 20px;
    }
    
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; color: var(--sand);
      text-decoration: none; font-weight: 600; transition: all 0.3s;
    }
    .back-link:hover { color: var(--accent); transform: translateX(-5px); }
    
    h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--sand); }
    
    .admin-badge {
      background: linear-gradient(135deg, var(--purple), #6d28d9); padding: 10px 25px;
      border-radius: 25px; display: flex; align-items: center; gap: 10px; font-weight: 600;
    }
    
    .auth-warning {
      background: linear-gradient(135deg, var(--error), #dc2626); color: white;
      padding: 15px 25px; border-radius: 10px; display: flex; align-items: center;
      gap: 15px; margin-bottom: 30px;
    }
    .auth-warning a { color: white; font-weight: 600; }
    
    /* Tabs */
    .tabs-container { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
    .tab-btn {
      padding: 15px 30px; border: none; border-radius: 10px; font-size: 1rem;
      font-weight: 600; cursor: pointer; transition: all 0.3s;
      background: rgba(255,255,255,0.1); color: var(--light);
      display: flex; align-items: center; gap: 10px;
    }
    .tab-btn.active { background: linear-gradient(135deg, var(--purple), #6d28d9); }
    .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.2); }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .main-grid { display: grid; grid-template-columns: 380px 1fr; gap: 30px; }
    @media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }
    
    .sidebar { display: flex; flex-direction: column; gap: 20px; }
    
    .card {
      background: rgba(255,255,255,0.05); border-radius: 16px; padding: 25px;
      backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
    }
    .card h2 {
      font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 20px;
      color: var(--sand); display: flex; align-items: center; gap: 10px;
    }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--light); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px 16px; border: 2px solid rgba(255,255,255,0.1);
      border-radius: 10px; font-size: 1rem; background: rgba(0,0,0,0.3);
      color: white; transition: all 0.3s;
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--purple); background: rgba(0,0,0,0.5);
    }
    
    .btn {
      width: 100%; padding: 14px 20px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn-primary { background: linear-gradient(135deg, var(--purple), #6d28d9); color: white; }
    .btn-success { background: linear-gradient(135deg, var(--success), #16a34a); color: white; }
    .btn-danger { background: linear-gradient(135deg, var(--error), #dc2626); color: white; }
    .btn-warning { background: linear-gradient(135deg, var(--warning), #d97706); color: var(--dark); }
    .btn-info { background: linear-gradient(135deg, var(--info), #2563eb); color: white; }
    
    .response-area { flex: 1; }
    .response-card {
      background: rgba(0,0,0,0.4); border-radius: 16px; overflow: hidden;
      height: 100%; min-height: 700px; border: 1px solid rgba(255,255,255,0.1);
    }
    .response-header {
      background: rgba(255,255,255,0.05); padding: 15px 25px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .response-header h3 { color: var(--sand); font-family: 'Playfair Display', serif; }
    
    .status-badge { padding: 6px 15px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
    .status-badge.success { background: var(--success); color: white; }
    .status-badge.error { background: var(--error); color: white; }
    .status-badge.pending { background: var(--warning); color: var(--dark); }
    
    .response-body { padding: 25px; max-height: 630px; overflow-y: auto; }
    .response-body pre {
      background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px;
      color: var(--light); font-family: 'Fira Code', monospace;
      font-size: 0.85rem; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word;
    }
    
    /* Dashboard Stats */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px; margin-bottom: 20px;
    }
    .stat-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(109, 40, 217, 0.3));
      padding: 20px; border-radius: 12px; text-align: center;
    }
    .stat-card .number { font-size: 2rem; font-weight: 700; color: var(--sand); }
    .stat-card .label { font-size: 0.9rem; color: rgba(255,255,255,0.7); margin-top: 5px; }
    
    /* Products Table */
    .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .data-table th, .data-table td {
      padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .data-table th { background: rgba(255,255,255,0.05); font-weight: 600; color: var(--sand); }
    .data-table tr:hover { background: rgba(255,255,255,0.05); }
    .data-table img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    
    /* Orders list */
    .orders-list { display: flex; flex-direction: column; gap: 15px; }
    .order-card {
      background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px;
      border-left: 4px solid var(--purple);
    }
    .order-card h4 { color: var(--sand); margin-bottom: 10px; }
    .order-card p { color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-bottom: 5px; }
    
    .order-status {
      display: inline-block; padding: 4px 12px; border-radius: 15px;
      font-size: 0.8rem; font-weight: 600;
    }
    .order-status.pending { background: var(--warning); color: var(--dark); }
    .order-status.accepted { background: var(--success); color: white; }
    .order-status.rejected { background: var(--error); color: white; }
    
    .order-actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .btn-small { padding: 8px 15px; font-size: 0.85rem; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; }
    .btn-accept { background: var(--success); color: white; }
    .btn-reject { background: var(--error); color: white; }
    .btn-edit { background: var(--warning); color: var(--dark); }
    
    .file-upload {
      border: 2px dashed rgba(255,255,255,0.2); padding: 25px; text-align: center;
      border-radius: 10px; cursor: pointer; transition: all 0.3s;
    }
    .file-upload:hover { border-color: var(--purple); background: rgba(139, 92, 246, 0.1); }
    .file-upload input { display: none; }
    
    .alert {
      padding: 15px 20px; border-radius: 10px; margin-bottom: 15px;
      display: flex; align-items: center; gap: 10px;
    }
    .alert-success { background: rgba(34, 197, 94, 0.2); border: 1px solid var(--success); color: var(--success); }
    .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--error); color: var(--error); }
    
    .loading { display: flex; align-items: center; justify-content: center; padding: 40px; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--purple); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>👨‍💼 Admin Dashboard</h1>
      <div class="admin-badge" id="adminBadge">
        <span>👤</span>
        <span id="adminName">Not Logged In</span>
      </div>
    </header>

    <div id="authWarning" class="auth-warning" style="display: none;">
      ⚠️ <span>Anda perlu login sebagai admin. <a href="auth.html">Login terlebih dahulu</a></span>
    </div>

    <div class="tabs-container">
      <button class="tab-btn" onclick="switchTab('orders')">🛒 Orders</button>
    </div>

      <div class="main-grid">

            <h2>📊 Dashboard</h2>

            <div class="response-body">

    <div class="tab-content active" id="productsTab">
      <div class="main-grid">
        <div class="sidebar">
          <div class="card">
            <h2>📦 Product Management</h2>
            <button class="btn btn-primary" onclick="getAdminProducts()">📋 Load All Products</button>
          </div>
          
          <div class="card" id="productFormCard">
            <h2 id="formTitle">➕ Add New Product</h2>
            <input type="hidden" id="editProductId"> <div class="form-group">
              <label for="prodName">Nama Produk</label>
              <input type="text" id="prodName" placeholder="Contoh: Tiket Konser">
            </div>
            <div class="form-group">
              <label for="prodDesc">Deskripsi</label>
              <textarea id="prodDesc" placeholder="Deskripsi lengkap..."></textarea>
            </div>
            <div class="form-group">
              <label for="prodPrice">Harga (IDR)</label>
              <input type="number" id="prodPrice" placeholder="50000">

            <div class="form-group">
              <label for="prodStock">Stok</label>
              <input type="number" id="prodStock" placeholder="100">
            </div>
            <div class="form-group">
              <label for="prodType">Tipe Produk</label>
              <select id="prodType">
                <option value="merchandise">Merchandise</option>

              <select id="prodCategory">
                <option value="">-- Pilih Kategori --</option>
              </select>
            </div>
            <div class="form-group">
              <label>Gambar Produk</label>
              <label class="file-upload" for="prodImage">

                <p>Klik untuk upload gambar</p>
                <input type="file" id="prodImage" accept="image/*">
                <p id="prodFileName" style="color: var(--purple); margin-top: 10px;"></p>
              </label>
            </div>
            
            <button id="btnSaveProduct" class="btn btn-success" onclick="saveProduct()">➕ Create Product</button>
            <button id="btnCancelEdit" class="btn btn-warning" onclick="resetForm()" style="display: none;">❌ Cancel Edit</button>
          </div>
        </div>
        
        <div class="response-area">
          <div class="response-card">
            <div class="response-header">
              <h3>📡 Product List</h3>
              <span class="status-badge pending" id="productsStatus">Ready</span>

    <div class="tab-content" id="ordersTab">
      <div class="main-grid">
        <div class="sidebar">
          <div class="card">
            <h2>🛒 Order Management</h2>
            <button class="btn btn-primary" onclick="getAdminOrders()">🔄 Refresh Orders</button>
            <div class="form-group" style="margin-top: 15px;">
              <label for="orderStatusFilter">Filter Status</label>
              <select id="orderStatusFilter" onchange="getAdminOrders()">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="accepted">Accepted</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
          </div>
        </div>
        
        <div class="response-area">
          <div class="response-card">
            <div class="response-header">

              <span class="status-badge pending" id="ordersStatus">Ready</span>
            </div>
            <div class="response-body">
              <div id="ordersAlert"></div>
              <div id="ordersDisplay"></div>
            </div>

      </div>

  <script>
    const API_BASE_URL = 'https://uigtc.id/api';
    
    function formatCurrency(price) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(price);
    }
    
    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function apiCall(endpoint, method = 'GET', body = null, isFormData = false) {
      try {
        const token = localStorage.getItem('token');
        const headers = {};
        if (token) headers['Authorization'] = `Bearer ${token}`;
        if (!isFormData) headers['Content-Type'] = 'application/json';

        const options = { method, headers };
        if (body) options.body = isFormData ? body : JSON.stringify(body);
        
        const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
        const data = await response.json();
        return { data, ok: response.ok };
      } catch (error) {
        return { data: { message: error.message }, ok: false };
      }
    }
    
    async function checkAuth() {
      const { data, ok } = await apiCall('/auth/me');
      if (ok && data.success && data.data && data.data.role === 'admin') {
        document.getElementById('authWarning').style.display = 'none';
        document.getElementById('adminName').textContent = data.data.name;
      } else {
        document.getElementById('authWarning').style.display = 'flex';
      }
    }
    
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(`${tab}Tab`).classList.add('active');
    }
    
    function showLoading(section) {
      document.getElementById(`${section}Status`).className = 'status-badge pending';
      document.getElementById(`${section}Status`).textContent = 'Loading...';
    }
    
    function showStatus(section, success) {
      const badge = document.getElementById(`${section}Status`);
      badge.className = `status-badge ${success ? 'success' : 'error'}`;
      badge.textContent = success ? '200 OK' : 'Error';
    }
    
    function showAlert(section, message, type = 'success') {
      const alertEl = document.getElementById(`${section}Alert`);
      if (alertEl) {
        alertEl.innerHTML = `<div class="alert alert-${type}">${type === 'success' ? '✅' : '❌'} ${message}</div>`;
        setTimeout(() => alertEl.innerHTML = '', 3000);
      }
    }

    // --- PRODUCTS LOGIC ---
    
    async function getAdminProducts() {
      showLoading('products');
      const { data, ok } = await apiCall('/admin/products');
      showStatus('products', ok);
      if (ok && data.success) renderProductsTable(data.data);
    }

    function renderProductsTable(products) {
      if (!products || products.length === 0) return document.getElementById('productsDisplay').innerHTML = '<p>Belum ada produk.</p>';
      
      const html = `<table class="data-table">
        <thead>
            <tr>
                <th>Img</th>
                <th>Name</th>
                <th>Status</th> <th>Price</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
        ${products.map(p => {
            const productStr = encodeURIComponent(JSON.stringify(p));
            // Cek status active
            const statusBadge = p.isActive 
                ? '<span style="color:#22c55e; font-weight:bold;">Active</span>' 
                : '<span style="color:#ef4444; font-weight:bold; background:rgba(239,68,68,0.1); padding:2px 6px; border-radius:4px;">Deleted</span>';
            
            // Disable tombol delete jika sudah deleted
            const deleteBtn = p.isActive 
                ? `<button onclick="handleDeleteProduct('${p.id}')" class="btn-small btn-reject">🗑️</button>` 
                : `<button disabled style="opacity:0.3; cursor:not-allowed;" class="btn-small">🗑️</button>`;

            return `<tr>
              <td>${p.image ? `<img src="${API_BASE_URL.replace('/api','')}${p.image}" onerror="this.src='https://via.placeholder.com/50'">` : '📦'}</td>
              <td>${p.name}<br><small style="color:#aaa">${p.category?.name || '-'}</small></td>
              <td>${statusBadge}</td>
              <td>${formatCurrency(p.price)}</td>
              <td>${p.stock}</td>
              <td style="display:flex; gap:5px;">
                <button onclick="prepareEdit('${productStr}')" class="btn-small btn-edit">✏️</button>
                ${deleteBtn}
              </td>
            </tr>`;
        }).join('')}</tbody></table>`;
      document.getElementById('productsDisplay').innerHTML = html;
    }

    // --- HANDLE CREATE & UPDATE ---
    async function saveProduct() {
      const id = document.getElementById('editProductId').value; // Check hidden ID
      const isEdit = !!id;
      
      const formData = new FormData();
      const fields = ['prodName', 'prodDesc', 'prodPrice', 'prodStock', 'prodType', 'prodCategory'];
      const apiFields = ['name', 'description', 'price', 'stock', 'productType', 'categoryId'];
      
      if(!document.getElementById('prodName').value) return showAlert('products', 'Nama produk wajib diisi', 'error');

      fields.forEach((domId, index) => {
        const val = document.getElementById(domId).value;
        if(val) formData.append(apiFields[index], val);
      });
      
      const img = document.getElementById('prodImage').files[0];
      if(img) formData.append('image', img);

      showLoading('products');
      
      // Determine endpoint & method
      const endpoint = isEdit ? `/admin/products/${id}` : '/admin/products';
      const method = isEdit ? 'PUT' : 'POST';

      const { data, ok } = await apiCall(endpoint, method, formData, true);
      
      showStatus('products', ok);
      if(ok) {
        showAlert('products', isEdit ? 'Produk berhasil diupdate!' : 'Produk berhasil dibuat!', 'success');
        resetForm(); // Clear form & reset mode
        getAdminProducts(); // Refresh list
      } else {
        showAlert('products', data.message || 'Gagal menyimpan produk', 'error');
      }
    }

    // --- EDIT HELPER ---
    function prepareEdit(encodedProduct) {
        const p = JSON.parse(decodeURIComponent(encodedProduct));
        
        // Fill form
        document.getElementById('editProductId').value = p.id;
        document.getElementById('prodName').value = p.name;
        document.getElementById('prodDesc').value = p.description || '';
        document.getElementById('prodPrice').value = p.price;
        document.getElementById('prodStock').value = p.stock;
        document.getElementById('prodType').value = p.productType;
        if(p.category) document.getElementById('prodCategory').value = p.category.id;
        
        document.getElementById('prodFileName').textContent = "Biarkan kosong jika tidak ubah gambar";

        // Change UI state
        document.getElementById('formTitle').textContent = "✏️ Edit Product";
        document.getElementById('btnSaveProduct').textContent = "💾 Update Product";
        document.getElementById('btnSaveProduct').classList.remove('btn-success');
        document.getElementById('btnSaveProduct').classList.add('btn-primary');
        document.getElementById('btnCancelEdit').style.display = 'inline-flex';
        
        // Scroll to form
        document.querySelector('.sidebar').scrollTop = 0;
    }

    function resetForm() {
        document.getElementById('editProductId').value = '';
        document.getElementById('prodName').value = '';
        document.getElementById('prodDesc').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodStock').value = '';
        document.getElementById('prodType').value = 'merchandise';
        document.getElementById('prodCategory').value = '';
        document.getElementById('prodImage').value = '';
        document.getElementById('prodFileName').textContent = '';

        // Reset UI state
        document.getElementById('formTitle').textContent = "➕ Add New Product";
        document.getElementById('btnSaveProduct').textContent = "➕ Create Product";
        document.getElementById('btnSaveProduct').classList.add('btn-success');
        document.getElementById('btnSaveProduct').classList.remove('btn-primary');
        document.getElementById('btnCancelEdit').style.display = 'none';
    }

    async function handleDeleteProduct(id) {
      if(!confirm('Yakin ingin menghapus produk ini?')) return;
      showLoading('products');
      const { data, ok } = await apiCall(`/admin/products/${id}`, 'DELETE');
      if(ok) {
        showAlert('products', 'Produk dihapus', 'success');
        getAdminProducts();
      } else {
        showAlert('products', data.message, 'error');
      }
    }

    async function loadCategories() {
      const { data, ok } = await apiCall('/products/categories');
      if(ok && data.data) {
        const sel = document.getElementById('prodCategory');
        sel.innerHTML = '<option value="">-- Pilih Kategori --</option>';
        data.data.forEach(c => sel.innerHTML += `<option value="${c.id}">${c.name}</option>`);
      }
    }

    // --- ORDERS ---
    async function getAdminOrders() {
      showLoading('orders');
      const status = document.getElementById('orderStatusFilter').value;
      const endpoint = status ? `/admin/orders?status=${status}` : '/admin/orders';
      
      const { data, ok } = await apiCall(endpoint);
      showStatus('orders', ok);
      
      if(ok && data.data) {
        // FILTER TAMBAHAN DI SINI: Sembunyikan 'awaiting_payment'
        const filteredOrders = data.data.filter(o => o.status !== 'awaiting_payment');

        if(filteredOrders.length === 0) {
            document.getElementById('ordersDisplay').innerHTML = '<p style="padding:20px; text-align:center">Tidak ada pesanan.</p>';
            return;
        }

        const html = `<div class="orders-list">${filteredOrders.map(o => `
          <div class="order-card">
            <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:10px;">
                <div>
                    <h4 style="margin:0">Order #${o.orderNumber || o.id.substring(0,8)}</h4>
                    <small style="color:#888">${formatDate(o.createdAt)}</small>
                </div>
                <span class="order-status ${o.status}">${o.status.toUpperCase()}</span>
            </div>
            
            <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:15px; font-size:0.9rem;">
                <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">
                    <p style="margin-bottom:5px;"><strong style="color:var(--sand)">👤 User Info:</strong></p>
                    <p><strong>Name:</strong> ${o.user?.name || 'Guest'}</p>
                    <p><strong>Email:</strong> ${o.user?.email || '-'}</p>
                    <p><strong>Phone:</strong> ${o.user?.phoneNumber || '-'}</p>
                    <p><strong>School:</strong> ${o.user?.schoolOrigin || '-'}</p>
                </div>

                <div>
                    <p><strong>Total:</strong> <span style="color:var(--success); font-size:1.1em;">${formatCurrency(o.totalAmount)}</span></p>
                    <div style="margin-top:10px;">
                        ${o.paymentProof ? `
                            <p style="margin-bottom:5px; font-size:0.8rem;">Bukti Bayar:</p>
                            <a href="${API_BASE_URL.replace('/api','')}${o.paymentProof}" target="_blank" style="display:inline-block; border:1px solid #555; padding:2px; border-radius:5px; transition:0.3s; background:rgba(0,0,0,0.3);">
                                <img src="${API_BASE_URL.replace('/api','')}${o.paymentProof}" style="height:60px; display:block;" alt="Proof">
                            </a>
                        ` : '<p style="color:#666; font-style:italic;">Belum upload bukti</p>'}
                    </div>
                </div>
            </div>

            <div style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1); font-size:0.85rem; color:#aaa;">
                <p>Items: ${o.items ? o.items.map(i => `${i.quantity}x ${i.productName}`).join(', ') : 'No items'}</p>
            </div>

            <div class="order-actions">
              ${o.status === 'pending' ? `
                <button onclick="handleAccept('${o.id}')" class="btn-small btn-accept">✅ Accept</button>
                <button onclick="handleReject('${o.id}')" class="btn-small btn-reject">❌ Reject</button>
              ` : ''}
            </div>
          </div>`).join('')}</div>`;
        document.getElementById('ordersDisplay').innerHTML = html;
      }
    }

    async function handleAccept(id) {
      if(!confirm('Terima pesanan ini?')) return;
      const { data, ok } = await apiCall(`/admin/orders/${id}/accept`, 'POST');
      if(ok) { showAlert('orders', 'Order Accepted!', 'success'); getAdminOrders(); }
      else showAlert('orders', data.message, 'error');
   }

   async function handleReject(id) {
      const reason = prompt('Masukkan alasan penolakan:');
      if(reason === null) return;
      const { data, ok } = await apiCall(`/admin/orders/${id}/reject`, 'POST', { reason });
      if(ok) { showAlert('orders', 'Order Rejected!', 'success'); getAdminOrders(); }
      else showAlert('orders', data.message, 'error');
   }

   // --- INIT ---
   document.getElementById('prodImage').addEventListener('change', function() {
     document.getElementById('prodFileName').textContent = this.files[0]?.name || '';
   });

    // --- DASHBOARD (Simplifed for context) ---
    async function getDashboard() {
        // (Logic dashboard dari sebelumnya bisa dipakai di sini)
    }

    // --- INIT ---
    document.getElementById('prodImage').addEventListener('change', function() {
      document.getElementById('prodFileName').textContent = this.files[0]?.name || '';
    });

    checkAuth();
    loadCategories();
    // Default load products tab content if active
    if(document.getElementById('productsTab').classList.contains('active')) {
        getAdminProducts();
    }
  </script>
</body>
</html>
