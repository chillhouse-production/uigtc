<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication API Test - UIGTC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&family=Fira+Code&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary: #0B2E34;
      --secondary: #135D66;
      --accent: #E39A3B;
      --sand: #F3CC91;
      --light: #E3FEF7;
      --dark: #1F2D2F;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
    }
    
    body {
      font-family: 'Source Sans Pro', sans-serif;
      background: linear-gradient(135deg, #2d1810 0%, var(--primary) 100%);
      min-height: 100vh;
      color: var(--light);
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 20px;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--sand);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .back-link:hover {
      color: var(--accent);
      transform: translateX(-5px);
    }
    
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: var(--sand);
    }
    
    .user-status {
      background: rgba(255,255,255,0.1);
      padding: 15px 25px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    
    .user-info {
      text-align: left;
    }
    
    .user-name {
      font-weight: 600;
      color: var(--light);
    }
    
    .user-role {
      font-size: 0.85rem;
      color: var(--sand);
      opacity: 0.8;
    }
    
    .main-grid {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 30px;
    }
    
    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 25px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: var(--sand);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--light);
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 1rem;
      background: rgba(0,0,0,0.3);
      color: white;
      transition: all 0.3s;
    }
    
    .form-group input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(0,0,0,0.5);
    }
    
    .btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #c97d20);
      color: var(--dark);
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: white;
    }
    
    .btn-danger {
      background: linear-gradient(135deg, var(--error), #dc2626);
      color: white;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: rgba(255,255,255,0.3);
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    
    .divider span {
      padding: 0 15px;
      font-size: 0.9rem;
    }
    
    .response-area {
      flex: 1;
    }
    
    .response-card {
      background: rgba(0,0,0,0.4);
      border-radius: 16px;
      overflow: hidden;
      height: 100%;
      min-height: 700px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .response-header {
      background: rgba(255,255,255,0.05);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .response-header h3 {
      color: var(--sand);
      font-family: 'Playfair Display', serif;
    }
    
    .status-badge {
      padding: 6px 15px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    .status-badge.success {
      background: var(--success);
      color: white;
    }
    
    .status-badge.error {
      background: var(--error);
      color: white;
    }
    
    .status-badge.pending {
      background: var(--warning);
      color: var(--dark);
    }
    
    .response-body {
      padding: 25px;
      max-height: 630px;
      overflow-y: auto;
    }
    
    .response-body pre {
      background: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 10px;
      color: var(--light);
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .user-card {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .user-card .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    
    .user-card h4 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }
    
    .user-card p {
      opacity: 0.8;
    }
    
    .user-card .verified {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.2);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-top: 10px;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(255,255,255,0.1);
      color: var(--light);
    }
    
    .tab.active {
      background: var(--accent);
      color: var(--dark);
    }
    
    .tab:hover:not(.active) {
      background: rgba(255,255,255,0.2);
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .alert {
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .alert-success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid var(--success);
      color: var(--success);
    }
    
    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--error);
      color: var(--error);
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 15px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="back-link">← Kembali ke Menu</a>
      <h1>🔐 Authentication API Test</h1>
      <div class="user-status" id="userStatus">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-info">
          <div class="user-name" id="userName">Guest</div>
          <div class="user-role" id="userRole">Not logged in</div>
        </div>
      </div>
    </header>

    <div class="main-grid">
      <div class="sidebar">
        <div class="card">
          <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Login</button>
            <button class="tab" onclick="switchTab('register')">Register</button>
          </div>
          
          <!-- Login Tab -->
          <div class="tab-content active" id="loginTab">
            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" placeholder="user@example.com">
            </div>
            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" onclick="login()">
              🔑 Login
            </button>
          </div>
          
          <!-- Register Tab -->
          <div class="tab-content" id="registerTab">
            <div class="form-group">
              <label for="regName">Nama Lengkap</label>
              <input type="text" id="regName" placeholder="John Doe">
            </div>
            <div class="form-group">
              <label for="regEmail">Email</label>
              <input type="email" id="regEmail" placeholder="user@example.com">
            </div>
            <div class="form-group">
              <label for="regPassword">Password</label>
              <input type="password" id="regPassword" placeholder="Min 6 karakter">
            </div>
            <button class="btn btn-primary" onclick="register()">
              📝 Register
            </button>
          </div>
        </div>
        
        <div class="card">
          <h2>🔍 Check Session</h2>
          <button class="btn btn-secondary" onclick="checkMe()" style="margin-bottom: 12px;">
            👤 Get Current User (/auth/me)
          </button>
          <button class="btn btn-danger" onclick="logout()" id="logoutBtn" disabled>
            🚪 Logout
          </button>
        </div>
        
        <div class="card">
          <h2>⚡ Quick Login</h2>
          <p style="color: rgba(255,255,255,0.6); margin-bottom: 15px; font-size: 0.9rem;">
            Gunakan kredensial test yang sudah ada:
          </p>
          <button class="btn btn-secondary" onclick="quickLogin('admin')" style="margin-bottom: 12px;">
            👨‍💼 Login as Admin
          </button>
          <button class="btn btn-secondary" onclick="quickLogin('user')">
            👤 Login as User
          </button>
        </div>
      </div>

      <div class="response-area">
        <div class="response-card">
          <div class="response-header">
            <h3>📡 Response</h3>
            <span class="status-badge pending" id="statusBadge">Ready</span>
          </div>
          <div class="response-body" id="responseBody">
            <div id="alertArea"></div>
            <div id="userDisplay"></div>
            <pre id="responseJson">// Klik salah satu action untuk melihat response...</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://uigtc.id/api';
    let currentUser = null;
    
    function switchTab(tab) {
      // Update tab buttons
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      
      // Update tab content
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(`${tab}Tab`).classList.add('active');
    }
    
    function showLoading() {
      document.getElementById('statusBadge').className = 'status-badge pending';
      document.getElementById('statusBadge').textContent = 'Loading...';
      document.getElementById('alertArea').innerHTML = '';
      document.getElementById('userDisplay').innerHTML = '';
      document.getElementById('responseJson').textContent = '';
    }
    
    function showResponse(data, success = true) {
      const badge = document.getElementById('statusBadge');
      badge.className = `status-badge ${success ? 'success' : 'error'}`;
      badge.textContent = success ? '200 OK' : 'Error';
      
      document.getElementById('responseJson').textContent = JSON.stringify(data, null, 2);
    }
    
    function showAlert(message, type = 'success') {
      document.getElementById('alertArea').innerHTML = `
        <div class="alert alert-${type}">
          ${type === 'success' ? '✅' : '❌'} ${message}
        </div>
      `;
    }
    
    function updateUserStatus(user = null) {
      currentUser = user;
      const avatar = document.getElementById('userAvatar');
      const name = document.getElementById('userName');
      const role = document.getElementById('userRole');
      const logoutBtn = document.getElementById('logoutBtn');
      
      if (user) {
        avatar.textContent = user.role === 'admin' ? '👨‍💼' : '👤';
        name.textContent = user.name;
        role.textContent = `${user.role} • ${user.email}`;
        logoutBtn.disabled = false;
      } else {
        avatar.textContent = '👤';
        name.textContent = 'Guest';
        role.textContent = 'Not logged in';
        logoutBtn.disabled = true;
      }
    }
    
    function renderUserCard(user) {
      document.getElementById('userDisplay').innerHTML = `
        <div class="user-card">
          <div class="avatar">${user.role === 'admin' ? '👨‍💼' : '👤'}</div>
          <h4>${user.name}</h4>
          <p>${user.email}</p>
          <p style="text-transform: capitalize; margin-top: 5px;">Role: ${user.role}</p>
          <span class="verified">
            ${user.isEmailVerified ? '✅ Email Verified' : '⚠️ Email Not Verified'}
          </span>
        </div>
      `;
    }
    
    async function apiCall(endpoint, method = 'GET', body = null) {
      showLoading();
      
      try {
        const token = localStorage.getItem('token');
        const options = {
          method,
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
          }
        };

        if (body) {
          options.body = JSON.stringify(body);
        }

        const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
        const data = await response.json();

        showResponse(data, response.ok);
        return { data, ok: response.ok };
      } catch (error) {
        showResponse({ success: false, error: error.message }, false);
        return { data: null, ok: false };
      }
    }

    async function register() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      
      if (!name || !email || !password) {
        showAlert('Semua field harus diisi!', 'error');
        return;
      }
      
      if (password.length < 6) {
        showAlert('Password minimal 6 karakter!', 'error');
        return;
      }
      
      const { data, ok } = await apiCall('/auth/register', 'POST', { name, email, password });
      
      if (ok && data.success) {
        showAlert('Registrasi berhasil! Silakan cek email untuk verifikasi.', 'success');
        if (data.data) {
          renderUserCard(data.data);
        }
      } else {
        showAlert(data?.message || 'Registrasi gagal!', 'error');
      }
    }
    
    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      
      if (!email || !password) {
        showAlert('Email dan password harus diisi!', 'error');
        return;
      }
      
      const { data, ok } = await apiCall('/auth/login', 'POST', { email, password });
      
      if (ok && data.success && data.data) {
        showAlert('Login berhasil!', 'success');
        updateUserStatus(data.data.user);
        renderUserCard(data.data.user);
        
        // Store token if needed
        if (data.data.token) {
          localStorage.setItem('token', data.data.token);
        }
      } else {
        showAlert(data?.message || 'Login gagal!', 'error');
        updateUserStatus(null);
      }
    }
    
    async function logout() {
      const { data, ok } = await apiCall('/auth/logout', 'POST');
      
      if (ok) {
        showAlert('Logout berhasil!', 'success');
        updateUserStatus(null);
        document.getElementById('userDisplay').innerHTML = '';
        localStorage.removeItem('token');
      } else {
        showAlert(data?.message || 'Logout gagal!', 'error');
      }
    }
    
    async function checkMe() {
      const { data, ok } = await apiCall('/auth/me');
      
      if (ok && data.success && data.data) {
        showAlert('Session aktif!', 'success');
        updateUserStatus(data.data);
        renderUserCard(data.data);
      } else {
        showAlert('Tidak ada session aktif', 'error');
        updateUserStatus(null);
        document.getElementById('userDisplay').innerHTML = '';
      }
    }
    
    async function quickLogin(type) {
      const credentials = {
        admin: { email: 'admin@example.com', password: 'admin123' },
        user: { email: 'user@example.com', password: 'user123' }
      };
      
      const cred = credentials[type];
      document.getElementById('loginEmail').value = cred.email;
      document.getElementById('loginPassword').value = cred.password;
      
      // Switch to login tab if not already
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab').classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById('loginTab').classList.add('active');
      
      await login();
    }
    
    // Check session on page load
    checkMe();
  </script>
</body>
</html>
