<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart API Test - UIGTC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&family=Fira+Code&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #0B2E34;
      --secondary: #135D66;
      --accent: #E39A3B;
      --sand: #F3CC91;
      --light: #E3FEF7;
      --dark: #1F2D2F;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
    }
    
    body {
      font-family: 'Source Sans Pro', sans-serif;
      background: linear-gradient(135deg, #2d1810 0%, var(--primary) 100%);
      min-height: 100vh;
      color: var(--light);
    }
    
    .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 40px; flex-wrap: wrap; gap: 20px;
    }
    
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; color: var(--sand);
      text-decoration: none; font-weight: 600; transition: all 0.3s;
    }
    .back-link:hover { color: var(--accent); transform: translateX(-5px); }
    
    h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--sand); }
    
    .user-status {
      background: rgba(255,255,255,0.1); padding: 15px 25px; border-radius: 50px;
      display: flex; align-items: center; gap: 15px;
    }
    .user-avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--accent);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }
    .user-name { font-weight: 600; color: var(--light); }
    .user-role { font-size: 0.85rem; color: var(--sand); opacity: 0.8; }
    
    .main-grid {
      display: grid; grid-template-columns: 400px 1fr; gap: 30px;
    }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
    
    .sidebar { display: flex; flex-direction: column; gap: 20px; }
    
    .card {
      background: rgba(255,255,255,0.05); border-radius: 16px; padding: 25px;
      backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
    }
    
    .card h2 {
      font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 20px;
      color: var(--sand); display: flex; align-items: center; gap: 10px;
    }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--light); }
    .form-group input {
      width: 100%; padding: 12px 16px; border: 2px solid rgba(255,255,255,0.1);
      border-radius: 10px; font-size: 1rem; background: rgba(0,0,0,0.3);
      color: white; transition: all 0.3s;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); background: rgba(0,0,0,0.5); }
    
    .btn {
      width: 100%; padding: 14px 20px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #c97d20); color: var(--dark); }
    .btn-secondary { background: linear-gradient(135deg, var(--secondary), var(--primary)); color: white; }
    .btn-danger { background: linear-gradient(135deg, var(--error), #dc2626); color: white; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .response-area { flex: 1; }
    .response-card {
      background: rgba(0,0,0,0.4); border-radius: 16px; overflow: hidden;
      height: 100%; min-height: 700px; border: 1px solid rgba(255,255,255,0.1);
      display: flex; flex-direction: column;
    }
    
    .response-header {
      background: rgba(255,255,255,0.05); padding: 15px 25px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .response-header h3 { color: var(--sand); font-family: 'Playfair Display', serif; }
    
    .status-badge { padding: 6px 15px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
    .status-badge.success { background: var(--success); color: white; }
    .status-badge.error { background: var(--error); color: white; }
    .status-badge.pending { background: var(--warning); color: var(--dark); }
    
    .response-body { padding: 25px; flex: 1; overflow-y: auto; }
    .response-body pre {
      background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px;
      color: var(--light); font-family: 'Fira Code', monospace; font-size: 0.9rem;
      white-space: pre-wrap; word-wrap: break-word;
    }

    /* Cart Specific Styles */
    .cart-table {
      width: 100%; border-collapse: collapse; margin-bottom: 20px;
      background: rgba(0,0,0,0.2); border-radius: 10px; overflow: hidden;
    }
    .cart-table th {
      background: rgba(255,255,255,0.1); padding: 12px; text-align: left;
      color: var(--sand); font-weight: 600;
    }
    .cart-table td {
      padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
      color: var(--light); font-size: 0.95rem;
    }
    .cart-table tr:last-child td { border-bottom: none; }
    
    .mini-btn {
      padding: 5px 10px; font-size: 0.8rem; border-radius: 5px; width: auto; display: inline-flex;
    }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab {
      flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
      background: rgba(255,255,255,0.1); color: var(--light); transition: 0.3s;
    }
    .tab.active { background: var(--accent); color: var(--dark); font-weight: bold; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .product-list-item {
      background: rgba(255,255,255,0.05); padding: 10px; margin-bottom: 8px;
      border-radius: 8px; font-size: 0.9rem; cursor: pointer; border: 1px solid transparent;
    }
    .product-list-item:hover { border-color: var(--sand); background: rgba(255,255,255,0.1); }
    .product-list-item small { display: block; color: var(--sand); margin-top: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="back-link">← Kembali ke Menu</a>
      <h1>🛒 Cart API Test</h1>
      <div class="user-status" id="userStatus">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-info">
          <div class="user-name" id="userName">Checking...</div>
          <div class="user-role" id="userRole">...</div>
        </div>
      </div>
    </header>

    <div class="main-grid">
      <div class="sidebar">
        
        <div class="tabs">
          <button class="tab active" onclick="switchTab('action')">Actions</button>
          <button class="tab" onclick="switchTab('products')">Product IDs</button>
        </div>

        <div class="tab-content active" id="actionTab">
          <div class="card">
            <h2>➕ Add to Cart</h2>
            <div class="form-group">
              <label for="productId">Product ID (UUID)</label>
              <input type="text" id="productId" placeholder="Paste ID Produk di sini...">
            </div>
            <div class="form-group">
              <label for="quantity">Quantity</label>
              <input type="number" id="quantity" value="1" min="1">
            </div>
            <button class="btn btn-primary" onclick="addToCart()">
              📥 Masukkan Keranjang
            </button>
          </div>

          <div class="card">
             <h2>🛠 Cart Tools</h2>
             <button class="btn btn-secondary" onclick="getCart()">
               🔄 Refresh Cart Data
             </button>
             <div id="alertArea" style="margin-top: 15px;"></div>
          </div>
        </div>

        <div class="tab-content" id="productsTab">
           <div class="card">
             <h2>📦 Available Products</h2>
             <p style="font-size: 0.85rem; margin-bottom: 10px; opacity: 0.8;">Klik produk untuk copy ID-nya</p>
             <button class="btn btn-secondary" onclick="loadProducts()" style="margin-bottom: 10px;">Load Products</button>
             <div id="productList" style="max-height: 400px; overflow-y: auto;">
                <p style="text-align: center; padding: 20px; opacity: 0.5;">Klik Load Products...</p>
             </div>
           </div>
        </div>
      </div>

      <div class="response-area">
        <div class="response-card">
          <div class="response-header">
            <h3>🛒 Isi Keranjang (Visual)</h3>
            <span class="status-badge pending" id="statusBadge">Ready</span>
          </div>
          
          <div class="response-body">
            <div id="visualCart">
               <p style="padding: 20px; text-align: center; opacity: 0.6;">Keranjang kosong atau belum diload.</p>
            </div>

            <h4 style="margin: 20px 0 10px; color: var(--sand); border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">📡 Raw Response JSON</h4>
            <pre id="responseJson">// JSON response akan muncul di sini...</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // URL API VPS (Ganti localhost jika test local)
    const API_BASE_URL = 'https://uigtc.id/api'; 

    // --- UTILS ---
    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      // Activate clicked
      event.target.classList.add('active');
      document.getElementById(tabName + 'Tab').classList.add('active');
    }

    function showAlert(msg, type='success') {
       const area = document.getElementById('alertArea');
       area.innerHTML = `<div style="padding:10px; border-radius:8px; background:${type==='success'?'rgba(34,197,94,0.2)':'rgba(239,68,68,0.2)'}; color:${type==='success'?'#22c55e':'#ef4444'}; border:1px solid currentColor;">${msg}</div>`;
       setTimeout(() => area.innerHTML = '', 3000);
    }

    // --- API CALLER (YANG SUDAH DIPERBAIKI) ---
    async function apiCall(endpoint, method = 'GET', body = null) {
      document.getElementById('statusBadge').textContent = 'Loading...';
      document.getElementById('statusBadge').className = 'status-badge pending';
      
      try {
        const token = localStorage.getItem('token');
        const options = {
          method,
          // credentials: 'include', // Opsional tergantung setting CORS
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
          }
        };
        
        if (body) options.body = JSON.stringify(body);
        
        const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
        const data = await response.json();
        
        document.getElementById('responseJson').textContent = JSON.stringify(data, null, 2);
        
        const badge = document.getElementById('statusBadge');
        if (response.ok) {
           badge.textContent = '200 OK';
           badge.className = 'status-badge success';
        } else {
           badge.textContent = 'Error';
           badge.className = 'status-badge error';
        }

        return { data, ok: response.ok };
      } catch (error) {
        document.getElementById('responseJson').textContent = `Error: ${error.message}`;
        return { data: null, ok: false };
      }
    }

    // --- AUTH CHECK ---
    async function checkAuth() {
       const { data, ok } = await apiCall('/auth/me');
       if (ok && data.success) {
          const user = data.data;
          document.getElementById('userName').textContent = user.name;
          document.getElementById('userRole').textContent = user.role;
          // Auto load cart if logged in
          getCart(); 
       } else {
          document.getElementById('userName').textContent = 'Not Logged In';
          document.getElementById('userRole').innerHTML = '<a href="auth.html" style="color:var(--accent)">Login Here</a>';
          showAlert('Silakan login di menu Auth dulu!', 'error');
       }
    }

    // --- CART FUNCTIONS ---

    async function getCart() {
       const { data, ok } = await apiCall('/cart');
       if (ok) {
          renderVisualCart(data);
       }
    }

    async function addToCart() {
       const productId = document.getElementById('productId').value.trim();
       const quantity = parseInt(document.getElementById('quantity').value);

       if (!productId) return showAlert('Isi Product ID dulu!', 'error');

       const { data, ok } = await apiCall('/cart', 'POST', { productId, quantity });
       if (ok) {
          showAlert('Berhasil ditambahkan!', 'success');
          renderVisualCart(data); // Update tampilan tabel
       } else {
          showAlert(data.message || 'Gagal menambahkan', 'error');
       }
    }

    async function removeFromCart(itemId) {
       if(!confirm('Hapus item ini?')) return;
       
       const { data, ok } = await apiCall(`/cart/${itemId}`, 'DELETE');
       if (ok) {
          renderVisualCart(data);
       }
    }

    // --- HELPER: RENDER TABEL CART ---
    function renderVisualCart(cartData) {
       const container = document.getElementById('visualCart');
       
       if (!cartData || !cartData.items || cartData.items.length === 0) {
          container.innerHTML = '<p style="padding:20px; text-align:center; border:1px dashed #666; border-radius:10px;">🛒 Keranjang Masih Kosong</p>';
          return;
       }

       let html = `
         <div style="margin-bottom:15px; font-weight:bold; color:var(--accent);">
            Total Virtual: Rp ${cartData.totalAmount ? cartData.totalAmount.toLocaleString() : 0}
         </div>
         <table class="cart-table">
           <thead>
             <tr>
               <th>Produk</th>
               <th>Harga</th>
               <th>Qty</th>
               <th>Total</th>
               <th>Aksi</th>
             </tr>
           </thead>
           <tbody>
       `;

       cartData.items.forEach(item => {
          const product = item.product || { name: 'Unknown', price: 0 };
          html += `
             <tr>
               <td>
                 <div style="font-weight:bold;">${product.name}</div>
                 <small style="opacity:0.6">${item.id}</small>
               </td>
               <td>Rp ${product.price.toLocaleString()}</td>
               <td>${item.quantity}</td>
               <td>Rp ${(product.price * item.quantity).toLocaleString()}</td>
               <td>
                 <button class="btn btn-danger mini-btn" onclick="removeFromCart('${item.id}')">
                    🗑 Hapus
                 </button>
               </td>
             </tr>
          `;
       });

       html += '</tbody></table>';
       container.innerHTML = html;
    }

    // --- HELPER: LOAD PRODUCTS ---
    async function loadProducts() {
       const container = document.getElementById('productList');
       container.innerHTML = '<p style="text-align:center;">Loading...</p>';

       const { data, ok } = await apiCall('/products'); // Asumsi endpoint product publik
       
       if (ok && Array.isArray(data)) { // Sesuaikan jika response dibungkus data: { data: [] }
          const products = data.data || data; // Handle wrapper
          
          if(products.length === 0) {
             container.innerHTML = '<p>Tidak ada produk.</p>';
             return;
          }

          let html = '';
          products.forEach(p => {
             html += `
                <div class="product-list-item" onclick="copyId('${p.id}')">
                   <div style="font-weight:bold; color:var(--light);">${p.name}</div>
                   <div style="display:flex; justify-content:space-between;">
                      <span style="color:var(--accent);">Rp ${p.price.toLocaleString()}</span>
                      <span style="color:var(--success);">Stok: ${p.stock}</span>
                   </div>
                   <small>ID: ${p.id} (Klik untuk copy)</small>
                </div>
             `;
          });
          container.innerHTML = html;
       } else {
          container.innerHTML = '<p style="color:var(--error)">Gagal memuat produk.</p>';
       }
    }

    function copyId(id) {
       document.getElementById('productId').value = id;
       showAlert('ID Produk dicopy ke form!', 'success');
       // Pindah tab otomatis biar user langsung bisa klik add
       switchTab('action'); 
    }

    // Init
    checkAuth();
  </script>
</body>
</html>
