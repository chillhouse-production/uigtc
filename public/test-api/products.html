<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products API Test - UIGTC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&family=Fira+Code&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary: #0B2E34;
      --secondary: #135D66;
      --accent: #E39A3B;
      --sand: #F3CC91;
      --light: #E3FEF7;
      --dark: #1F2D2F;
      --success: #22c55e;
      --error: #ef4444;
    }
    
    body {
      font-family: 'Source Sans Pro', sans-serif;
      background: linear-gradient(135deg, var(--light) 0%, #b8e6e0 100%);
      min-height: 100vh;
      color: var(--primary);
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 20px;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--secondary);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .back-link:hover {
      color: var(--primary);
      transform: translateX(-5px);
    }
    
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: var(--primary);
    }
    
    .main-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 30px;
    }
    
    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    
    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .endpoint-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 12px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .endpoint-btn:last-child {
      margin-bottom: 0;
    }
    
    .endpoint-btn.get {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: white;
    }
    
    .endpoint-btn:hover {
      transform: translateX(5px);
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }
    
    .method-tag {
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    
    .response-area {
      flex: 1;
    }
    
    .response-card {
      background: var(--primary);
      border-radius: 16px;
      overflow: hidden;
      height: 100%;
      min-height: 600px;
    }
    
    .response-header {
      background: rgba(255,255,255,0.1);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .response-header h3 {
      color: white;
      font-family: 'Playfair Display', serif;
    }
    
    .status-badge {
      padding: 6px 15px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    .status-badge.success {
      background: var(--success);
      color: white;
    }
    
    .status-badge.error {
      background: var(--error);
      color: white;
    }
    
    .status-badge.pending {
      background: var(--accent);
      color: var(--dark);
    }
    
    .response-body {
      padding: 25px;
      max-height: 550px;
      overflow-y: auto;
    }
    
    .response-body pre {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 10px;
      color: var(--light);
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: all 0.3s;
    }
    
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    
    .product-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #f0f0f0;
    }
    
    .product-info {
      padding: 15px;
    }
    
    .product-info h4 {
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 5px;
    }
    
    .product-info .price {
      color: var(--accent);
      font-weight: 700;
      font-size: 1.1rem;
    }
    
    .product-info .stock {
      font-size: 0.85rem;
      color: #666;
    }
    
    .category-tag {
      display: inline-block;
      background: var(--light);
      color: var(--secondary);
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 8px;
    }
    
    .categories-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    
    .cat-item {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 600;
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--light);
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 15px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .filter-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }
    
    .filter-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary);
    }
    
    .filter-section select {
      width: 100%;
      padding: 10px 15px;
      border: 2px solid #eee;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }
    
    .filter-section select:focus {
      outline: none;
      border-color: var(--secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="back-link">← Kembali ke Menu</a>
      <h1>📦 Products API Test</h1>
    </header>

    <div class="main-grid">
      <div class="sidebar">
        <div class="card">
          <h2>🚀 Endpoints</h2>
          
          <button class="endpoint-btn get" onclick="getAllProducts()">
            <span class="method-tag">GET</span>
            /products
          </button>
          
          <button class="endpoint-btn get" onclick="getMerchandise()">
            <span class="method-tag">GET</span>
            /products/merchandise
          </button>
          
          <button class="endpoint-btn get" onclick="getTickets()">
            <span class="method-tag">GET</span>
            /products/tickets
          </button>
          
          <button class="endpoint-btn get" onclick="getCategories()">
            <span class="method-tag">GET</span>
            /products/categories
          </button>
          
          <button class="endpoint-btn get" onclick="getMerchCategories()">
            <span class="method-tag">GET</span>
            /products/categories/merchandise
          </button>
          
          <div class="filter-section">
            <label for="categoryFilter">Filter by Category:</label>
            <select id="categoryFilter" onchange="getMerchandiseByCategory()">
              <option value="">All Categories</option>
            </select>
          </div>
        </div>

        <div class="card">
          <h2>🔍 Get Product by ID</h2>
          <input type="text" id="productId" placeholder="Enter Product ID..." 
            style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; margin-bottom: 12px; font-size: 1rem;">
          <button class="endpoint-btn get" onclick="getProductById()">
            <span class="method-tag">GET</span>
            /products/:id
          </button>
        </div>
      </div>

      <div class="response-area">
        <div class="response-card">
          <div class="response-header">
            <h3>📡 Response</h3>
            <span class="status-badge pending" id="statusBadge">Ready</span>
          </div>
          <div class="response-body" id="responseBody">
            <pre id="responseJson">// Klik salah satu endpoint untuk melihat response...</pre>
            <div id="visualOutput"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://uigtc.id/api';
    
    function formatCurrency(price) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
      }).format(price);
    }
    
    function showLoading() {
      document.getElementById('statusBadge').className = 'status-badge pending';
      document.getElementById('statusBadge').textContent = 'Loading...';
      document.getElementById('responseJson').textContent = '';
      document.getElementById('visualOutput').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <span>Fetching data...</span>
        </div>
      `;
    }
    
    function showResponse(data, success = true) {
      const badge = document.getElementById('statusBadge');
      badge.className = `status-badge ${success ? 'success' : 'error'}`;
      badge.textContent = success ? '200 OK' : 'Error';
      
      document.getElementById('responseJson').textContent = JSON.stringify(data, null, 2);
      document.getElementById('visualOutput').innerHTML = '';
    }
    
    function showError(error) {
      const badge = document.getElementById('statusBadge');
      badge.className = 'status-badge error';
      badge.textContent = 'Error';
      
      document.getElementById('responseJson').textContent = JSON.stringify({
        success: false,
        error: error.message
      }, null, 2);
      document.getElementById('visualOutput').innerHTML = '';
    }
    
    function renderProducts(products) {
      if (!products || products.length === 0) {
        document.getElementById('visualOutput').innerHTML = '<p style="color: #ccc; text-align: center; padding: 20px;">Tidak ada produk ditemukan</p>';
        return;
      }
      
      const html = `
        <div class="products-grid">
          ${products.map(p => `
            <div class="product-card">
              ${p.image 
                ? `<img src="${API_BASE_URL.replace('/api', '')}${p.image}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">`
                : `<div class="product-img" style="display: flex; align-items: center; justify-content: center; font-size: 3rem;">📦</div>`
              }
              <div class="product-info">
                <h4>${p.name}</h4>
                <p class="price">${formatCurrency(p.price)}</p>
                <p class="stock">Stok: ${p.stock}</p>
                ${p.category ? `<span class="category-tag">${p.category.name}</span>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('visualOutput').innerHTML = html;
    }
    
    function renderCategories(categories) {
      if (!categories || categories.length === 0) {
        document.getElementById('visualOutput').innerHTML = '<p style="color: #ccc; text-align: center; padding: 20px;">Tidak ada kategori ditemukan</p>';
        return;
      }
      
      const html = `
        <div class="categories-list">
          ${categories.map(c => `
            <span class="cat-item">${c.name} (${c.slug})</span>
          `).join('')}
        </div>
      `;
      document.getElementById('visualOutput').innerHTML = html;
    }
    
    async function apiCall(endpoint) {
      showLoading();
      
      try {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, {
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json'
          }
        });
        
        const data = await response.json();
        showResponse(data, response.ok);
        return { data, ok: response.ok };
      } catch (error) {
        showError(error);
        return { data: null, ok: false };
      }
    }
    
    async function getAllProducts() {
      const { data, ok } = await apiCall('/products');
      if (ok && data.success && data.data) {
        renderProducts(data.data);
      }
    }
    
    async function getMerchandise() {
      const { data, ok } = await apiCall('/products/merchandise');
      if (ok && data.success && data.data) {
        renderProducts(data.data);
      }
    }
    
    async function getTickets() {
      const { data, ok } = await apiCall('/products/tickets');
      if (ok && data.success && data.data) {
        renderProducts(data.data);
      }
    }
    
    async function getCategories() {
      const { data, ok } = await apiCall('/products/categories');
      if (ok && data.success && data.data) {
        renderCategories(data.data);
      }
    }
    
    async function getMerchCategories() {
      const { data, ok } = await apiCall('/products/categories/merchandise');
      if (ok && data.success && data.data) {
        renderCategories(data.data);
        
        // Update filter dropdown
        const select = document.getElementById('categoryFilter');
        select.innerHTML = '<option value="">All Categories</option>';
        data.data.forEach(cat => {
          select.innerHTML += `<option value="${cat.slug}">${cat.name}</option>`;
        });
      }
    }
    
    async function getMerchandiseByCategory() {
      const category = document.getElementById('categoryFilter').value;
      const endpoint = category 
        ? `/products/merchandise?category=${category}`
        : '/products/merchandise';
      
      const { data, ok } = await apiCall(endpoint);
      if (ok && data.success && data.data) {
        renderProducts(data.data);
      }
    }
    
    async function getProductById() {
      const id = document.getElementById('productId').value.trim();
      if (!id) {
        alert('Masukkan Product ID terlebih dahulu!');
        return;
      }
      
      const { data, ok } = await apiCall(`/products/${id}`);
      if (ok && data.success && data.data) {
        renderProducts([data.data]);
      }
    }
    
    // Load categories on page load
    getMerchCategories();
  </script>
</body>
</html>
