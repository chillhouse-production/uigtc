<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Products API Test - UIGTC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&family=Fira+Code&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #0B2E34; --secondary: #135D66; --accent: #E39A3B;
      --sand: #F3CC91; --light: #E3FEF7; --dark: #1F2D2F;
      --success: #22c55e; --error: #ef4444;
    }
    
    body {
      font-family: 'Source Sans Pro', sans-serif;
      background: linear-gradient(135deg, var(--light) 0%, #b8e6e0 100%);
      min-height: 100vh; color: var(--primary);
    }
    
    .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; flex-wrap: wrap; gap: 20px;
    }
    
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; color: var(--secondary);
      text-decoration: none; font-weight: 600; transition: all 0.3s;
    }
    .back-link:hover { color: var(--primary); transform: translateX(-5px); }
    
    h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--primary); }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn {
      padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
      font-weight: 600; background: rgba(255,255,255,0.5); color: var(--primary);
      transition: 0.3s;
    }
    .tab-btn.active { background: var(--secondary); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .main-grid { display: grid; grid-template-columns: 300px 1fr; gap: 30px; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
    
    .card {
      background: white; border-radius: 16px; padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08); margin-bottom: 20px;
    }
    .card h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--secondary); }
    
    .endpoint-btn {
      width: 100%; padding: 12px 15px; border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.3s;
      margin-bottom: 10px; text-align: left; display: flex; align-items: center; gap: 10px;
      background: white; border: 1px solid #ddd; color: var(--primary);
    }
    .endpoint-btn:hover { background: var(--light); border-color: var(--secondary); }
    .endpoint-btn.active { background: var(--secondary); color: white; border-color: var(--secondary); }
    
    .method-tag {
      background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; color: #555;
    }
    
    /* Response Area */
    .response-card {
      background: var(--primary); border-radius: 16px; overflow: hidden;
      height: 100%; min-height: 600px; display: flex; flex-direction: column;
    }
    .response-header {
      background: rgba(255,255,255,0.1); padding: 15px 25px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .response-header h3 { color: white; font-family: 'Playfair Display', serif; }
    .status-badge { padding: 4px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: 600; }
    .status-badge.success { background: var(--success); color: white; }
    .status-badge.error { background: var(--error); color: white; }
    .status-badge.pending { background: var(--accent); color: var(--dark); }
    
    .response-body { padding: 20px; overflow-y: auto; flex: 1; }
    .json-view {
      background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; color: #a5f3fc;
      font-family: 'Fira Code', monospace; font-size: 0.85rem; white-space: pre-wrap; margin-bottom: 20px;
      max-height: 200px; overflow-y: auto;
    }

    /* Product Grid */
    .products-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px;
    }
    .product-card {
      background: white; border-radius: 10px; overflow: hidden; transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .product-card:hover { transform: translateY(-3px); }
    .product-img {
      width: 100%; height: 140px; object-fit: cover; background: #eee;
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
    }
    .product-info { padding: 12px; }
    .product-info h4 { font-size: 1rem; margin-bottom: 5px; color: var(--primary); line-height: 1.3; }
    .product-meta { font-size: 0.8rem; color: #666; display: flex; justify-content: space-between; margin-bottom: 8px; }
    .product-price { color: var(--accent); font-weight: 700; font-size: 1.1rem; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; background: #eee; }
    .badge.merch { background: #e0f2fe; color: #0369a1; }
    .badge.ticket { background: #dcfce7; color: #15803d; }

    /* Category List */
    .cat-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-item {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem;
    }

    .loading { text-align: center; padding: 40px; color: white; }
    .input-group { margin-bottom: 10px; }
    .input-group input, .input-group select {
      width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="back-link">← Kembali ke Menu</a>
      <h1>🛍️ Public Products API</h1>
    </header>

    <div class="main-grid">
      <div class="sidebar">
        <div class="card">
          <h2>🚀 Main Endpoints</h2>
          <button class="endpoint-btn" onclick="fetchData('/products', this)">
            <span class="method-tag">GET</span> All Products
          </button>
          <button class="endpoint-btn" onclick="fetchData('/products/merchandise', this)">
            <span class="method-tag">GET</span> Merchandise Only
          </button>
          <button class="endpoint-btn" onclick="fetchData('/products/tickets', this)">
            <span class="method-tag">GET</span> Tickets Only
          </button>
        </div>

        <div class="card">
          <h2>📂 Categories</h2>
          <button class="endpoint-btn" onclick="fetchData('/products/categories', this)">
            <span class="method-tag">GET</span> All Categories
          </button>
          <button class="endpoint-btn" onclick="fetchData('/products/categories/merchandise', this)">
            <span class="method-tag">GET</span> Merch Categories
          </button>
        </div>

        <div class="card">
          <h2>🔍 Filters & Search</h2>
          <div class="input-group">
            <select id="catFilter">
              <option value="">-- Select Category --</option>
            </select>
            <button class="endpoint-btn" style="margin-top:5px; background:var(--accent); color:white;" onclick="filterMerchByCategory()">
              Filter Merch by Category
            </button>
          </div>
          
          <hr style="margin: 15px 0; border:0; border-top:1px solid #eee;">

          <div class="input-group">
            <input type="text" id="productId" placeholder="Product ID (UUID)">
            <button class="endpoint-btn" style="margin-top:5px; background:var(--secondary); color:white;" onclick="getProductById()">
              Get Product By ID
            </button>
          </div>
        </div>
      </div>

      <div class="response-area">
        <div class="response-card">
          <div class="response-header">
            <h3 id="currentEndpoint">Select an endpoint...</h3>
            <span class="status-badge pending" id="statusBadge">Idle</span>
          </div>
          <div class="response-body" id="responseBody">
            <p style="color:rgba(255,255,255,0.5); text-align:center; margin-top:50px;">
              Hasil request akan muncul di sini.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://uigtc.id/api';

    // --- UTILS ---
    function formatCurrency(price) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(price);
    }

    function setActiveBtn(btn) {
      document.querySelectorAll('.endpoint-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
    }

    // --- CORE API CALLER ---
    async function fetchData(endpoint, btnElement = null) {
      if(btnElement) setActiveBtn(btnElement);
      document.getElementById('currentEndpoint').textContent = endpoint;
      document.getElementById('statusBadge').className = 'status-badge pending';
      document.getElementById('statusBadge').textContent = 'Loading...';
      document.getElementById('responseBody').innerHTML = '<div class="loading">Fetching data...</div>';

      try {
        const res = await fetch(`${API_BASE_URL}${endpoint}`);
        const data = await res.json();

        // Update Status Badge
        const badge = document.getElementById('statusBadge');
        badge.className = `status-badge ${res.ok ? 'success' : 'error'}`;
        badge.textContent = res.ok ? `${res.status} OK` : `Error ${res.status}`;

        // Render Data
        renderResponse(data, endpoint);

      } catch (err) {
        document.getElementById('statusBadge').className = 'status-badge error';
        document.getElementById('statusBadge').textContent = 'Network Error';
        document.getElementById('responseBody').innerHTML = `<p style="color:#ef4444">Failed to fetch: ${err.message}</p>`;
      }
    }

    // --- SPECIFIC HANDLERS ---
    function filterMerchByCategory() {
      const cat = document.getElementById('catFilter').value;
      if(!cat) return alert('Pilih kategori dulu!');
      fetchData(`/products/merchandise?category=${cat}`);
    }

    function getProductById() {
      const id = document.getElementById('productId').value.trim();
      if(!id) return alert('Masukkan ID Produk!');
      fetchData(`/products/${id}`);
    }

    // --- RENDER LOGIC ---
    function renderResponse(data, endpoint) {
      const container = document.getElementById('responseBody');
      
      // 1. Show JSON Preview (Small)
      let html = `
        <div class="json-view">${JSON.stringify(data, null, 2)}</div>
        <h4 style="color:var(--sand); margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:5px;">Visual Preview</h4>
      `;

      if (!data.success || !data.data) {
        html += `<p style="color:white">No data returned or request failed.</p>`;
        container.innerHTML = html;
        return;
      }

      const items = Array.isArray(data.data) ? data.data : [data.data]; // Handle single object vs array

      // 2. Render Categories (Jika endpoint categories)
      if (endpoint.includes('categories')) {
        html += `<div class="cat-list">`;
        items.forEach(c => {
          html += `<div class="cat-item">${c.name} <small style="opacity:0.7">(${c.slug})</small></div>`;
        });
        html += `</div>`;
      } 
      // 3. Render Products
      else if (items.length > 0 && items[0].price) { 
        html += `<div class="products-grid">`;
        items.forEach(p => {
          const typeBadge = p.productType?.includes('ticket') ? 'ticket' : 'merch';
          const imgUrl = p.image ? `${API_BASE_URL.replace('/api','')}${p.image}` : null;
          
          html += `
            <div class="product-card">
              <div class="product-img">
                ${imgUrl ? `<img src="${imgUrl}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
                <span style="display:${imgUrl ? 'none' : 'flex'}">📦</span>
              </div>
              <div class="product-info">
                <h4>${p.name}</h4>
                <div class="product-meta">
                  <span class="badge ${typeBadge}">${p.productType || 'Product'}</span>
                  <span>Stok: <b>${p.stock}</b></span>
                </div>
                <div class="product-price">${formatCurrency(p.price)}</div>
                <div style="font-size:0.75rem; color:#888; margin-top:5px; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">ID: ${p.id}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<p style="color:white">Data kosong atau format tidak dikenali.</p>`;
      }

      container.innerHTML = html;
    }

    // --- INIT ---
    // Load categories untuk dropdown saat halaman dibuka
    async function initCategories() {
      try {
        const res = await fetch(`${API_BASE_URL}/products/categories`);
        const json = await res.json();
        if(json.success) {
          const sel = document.getElementById('catFilter');
          json.data.forEach(c => {
            sel.innerHTML += `<option value="${c.slug}">${c.name}</option>`;
          });
        }
      } catch(e) { console.log("Failed to load categories dropdown"); }
    }
    
    initCategories();

  </script>
</body>
</html>
